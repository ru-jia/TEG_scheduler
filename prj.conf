CONFIG_ADC=y
CONFIG_I2C=y
CONFIG_ADC_ADS1X1X=y
CONFIG_SENSOR=y
CONFIG_SHT4X=y

# Phone-facing Nordic UART Service for USB-powered integration tests.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="TEG_XIAO"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_NUS=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Send printf output to the XIAO USB-C port.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_BOOT_BANNER=n

# Floating-point voltage values in CSV output.
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
